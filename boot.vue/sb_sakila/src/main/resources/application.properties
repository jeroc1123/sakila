spring.application.name=sb_sakila

# Configuracion de la Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sakila
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
# "update" actualiza las tablas autom�ticamente si cambias los POJOs.
# Para produccion se usa "none" o "validate", pero para aprender "update" es perfecto.
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL reales en la consola de STS (uil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
